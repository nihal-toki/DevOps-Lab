apiVersion: v1
kind: Pod
metadata:
  name: hello-k8s
  labels:
    run: hello-k8s
spec:
  containers:
    - name: hello-k8s
      image: nginx
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello-k8s
spec:
  type: NodePort
  selector:
    run: hello-k8s
  ports:
    - port: 80
      targetPort: 80
